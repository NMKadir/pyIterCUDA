[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "cusolve"
version = "0.1.0"
description = "CUDA-accelerated iterative solver library"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.scikit-build]
wheel.packages = ["python/cusolve"]
cmake.source-dir = "."